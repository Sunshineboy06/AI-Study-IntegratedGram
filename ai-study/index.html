<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI学习一体化平台</title>
<link rel="stylesheet" href="css/style.css">
<script>
/* 主题防闪烁：渲染前根据本地偏好挂上 dark 类 */
try {
  if (localStorage.getItem('platform.theme') === 'dark') document.documentElement.classList.add('dark');
} catch (e) { /* 隐私模式等忽略 */ }
</script>
</head>
<body>
<div class="wash wash-a"></div>
<div class="wash wash-b"></div>
<div class="announce">
  <span>AI STUDY PLATFORM</span>
  <span class="a-spacer"></span>
  <span>NOTES → MINDMAP · QUIZ · VOCABULARY</span>
  <span class="a-pill">127.0.0.1:8796</span>
</div>
<header class="topbar" id="topbar">
  <div class="tb-left">
    <a class="brand" href="#" data-view="home"><span class="brand-mark" aria-hidden="true"></span>AI学习一体化平台</a>
    <div class="folderbar" id="folderbar">
      <span class="folder-label" aria-hidden="true"></span>
      <select id="folder-select" title="选择课程文件夹，之后刷题/复习/错题本都只使用该文件夹内的数据"></select>
      <button class="btn ghost sm" id="folder-manage" title="管理课程文件夹">管理</button>
    </div>
  </div>
  <nav class="tabs" id="main-tabs">
    <button data-view="home" class="active">首页</button>
    <button data-view="vocab">背单词</button>
    <button data-view="setup">刷题</button>
    <button data-view="mindmap">总复习</button>
    <button data-view="wrongbook">错题本</button>
    <button data-view="data">数据管理</button>
  </nav>
  <div class="tb-right">
    <button class="btn ghost sm" id="theme-toggle" title="切换深浅色主题">◐ 夜间</button>
  </div>
</header>

<main id="main"></main>

<div id="toast-box"></div>
<dialog id="dlg"></dialog>

<script src="js/util.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/prompts.js"></script>
<script src="js/keyword.js"></script>
<script src="js/importer.js"></script>
<script src="js/storage.js"></script>
<script src="js/vocab.js"></script>
<script src="js/quiz.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
