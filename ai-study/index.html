<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI学习一体化平台</title>
<!-- 载入衬线与人文无衬线字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- 引入全局统一三态主题管理器 -->
<script src="../assets/theme.js"></script>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="tb-left">
    <a class="brand" href="#" data-view="home"><span class="brand-mark" aria-hidden="true"></span>AI学习一体化平台</a>
    <div class="folderbar" id="folderbar">
      <span class="folder-label" aria-hidden="true"></span>
      <select id="folder-select" title="选择课程文件夹，之后刷题/复习/错题本都只使用该文件夹内的数据"></select>
      <button class="btn ghost sm" id="folder-manage" title="管理课程文件夹">管理</button>
    </div>
  </div>
  <nav class="tabs" id="main-tabs">
    <button data-view="home" class="active">首页</button>
    <button data-view="vocab">背单词</button>
    <button data-view="setup">刷题</button>
    <button data-view="mindmap">总复习</button>
    <button data-view="wrongbook">错题本</button>
    <button data-view="data">数据管理</button>
  </nav>
  <div class="tb-right">
    <a href="../index.html" class="btn ghost sm" title="返回门户主页" style="text-decoration:none">← 门户</a>
    <!-- 三态主题切换微型胶囊 -->
    <div class="theme-switch-mini" role="group" aria-label="主题切换" style="display:inline-flex;align-items:center;background:var(--color-cloud-gray);padding:2px;border-radius:9999px;border:1px solid var(--color-ash)">
      <button data-theme-choice="system" title="跟随系统" style="border:none;background:transparent;padding:3px 7px;border-radius:9999px;font-size:12px;cursor:pointer">💻</button>
      <button data-theme-choice="light" title="浅色" style="border:none;background:transparent;padding:3px 7px;border-radius:9999px;font-size:12px;cursor:pointer">☀️</button>
      <button data-theme-choice="dark" title="深色" style="border:none;background:transparent;padding:3px 7px;border-radius:9999px;font-size:12px;cursor:pointer">🌙</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="toast-box"></div>
<dialog id="dlg"></dialog>

<script src="js/util.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/prompts.js"></script>
<script src="js/keyword.js"></script>
<script src="js/importer.js"></script>
<script src="js/storage.js"></script>
<script src="js/vocab.js"></script>
<script src="js/quiz.js"></script>
<script src="js/mindmap.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
